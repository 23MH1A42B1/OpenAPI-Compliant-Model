events {
    worker_connections 1024;
}

http {
    # Define rate limiting zone: 10 requests per second per IP with 10MB memory zone
    limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/s;

    server {
        listen 80;
        server_name localhost;

        # HTTP Security hardening headers
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;

        location / {
            # Apply rate limiting with burst buffer
            limit_req zone=mylimit burst=20 nodelay;

            # Forward traffic to isolated API backend via Docker DNS
            proxy_pass http://api:8000;

            # Forward original client request metadata
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
